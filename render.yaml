# Render deployment config for the Page Pulse backend.
# Docs: https://render.com/docs/blueprint-spec
# Create a new service from this blueprint at:
#   https://dashboard.render.com/select-repo?type=blueprint

services:
  - type: web
    name: page-pulse-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        # Set this to your Vercel frontend URL after deploying the client.
        sync: false
      - key: AUDIT_TIMEOUT_MS
        value: 5000
      - key: MAX_CONCURRENT_AUDITS
        value: 10
      - key: CACHE_TTL_SECONDS
        value: 600
      - key: HISTORY_LIMIT
        value: 20
      - key: RATE_LIMIT_WINDOW_MS
        value: 3600000
      - key: RATE_LIMIT_MAX
        value: 100
